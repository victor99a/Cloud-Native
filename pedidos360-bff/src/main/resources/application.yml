server:
  port: 8080

spring:
  application:
    name: pedidos360-bff
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/<TENANT_ID>/v2.0}
          audiences:
            - ${AZURE_AUDIENCE:api://<API_APP_ID>}

downstream:
  base-url: ${DOWNSTREAM_URL:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
