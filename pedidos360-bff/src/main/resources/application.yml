server:
  port: 8080

spring:
  application:
    name: pedidos360-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/840f00c4-5744-42d5-8827-ed48c11ff4d4/v2.0}
          audiences:
            - ${AZURE_AUDIENCE:b4a1d505-4e63-4d74-ad9a-5f7baf82b7dd}

downstream:
  pedidos:
    base-url: ${DOWNSTREAM_PEDIDOS_URL:http://localhost:8081}
  productos:
    base-url: ${DOWNSTREAM_PRODUCTOS_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
