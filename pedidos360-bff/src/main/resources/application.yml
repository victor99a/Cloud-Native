server:
  port: 8080

spring:
  application:
    name: pedidos360-bff

# Validación del JWT de Keycloak (IDaaS local). Cero hardcoding.
app:
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/pedidos360}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/pedidos360/protocol/openid-connect/certs}
      audience: ${KEYCLOAK_AUDIENCE:pedidos360-spa}

downstream:
  pedidos:
    base-url: ${DOWNSTREAM_PEDIDOS_URL:http://localhost:8081}
  productos:
    base-url: ${DOWNSTREAM_PRODUCTOS_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
