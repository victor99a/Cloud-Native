server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: todas las rutas caen al index.html para el routing de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: caché agresiva e inmutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
