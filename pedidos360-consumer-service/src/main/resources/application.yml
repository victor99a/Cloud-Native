server:
  port: 8083

spring:
  application:
    name: pedidos360-consumer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# Nombres de colas, exchanges, DLX y routing keys centralizados (cero hardcoding).
pedidos360:
  rabbitmq:
    exchange-topic: pedidos360.topic
    exchange-direct: pedidos360.direct
    exchange-dlx: pedidos360.dlx
    queue-notificaciones: pedidos360.notificaciones.queue
    queue-tickets: pedidos360.tickets.queue
    queue-documentos: pedidos360.documentos.queue
    queue-notificaciones-dlq: pedidos360.notificaciones.dlq
    queue-tickets-dlq: pedidos360.tickets.dlq
    queue-documentos-dlq: pedidos360.documentos.dlq
    routing-pedido-creado: pedido.creado
    routing-pedido-todos: "pedido.#"
    routing-pedido-entregado: pedido.estado.entregado

management:
  endpoints:
    web:
      exposure:
        include: health,info
