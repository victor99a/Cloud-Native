server:
  port: 8083

spring:
  application:
    name: pedidos360-consumer-service
  rabbitmq:
    # Lista de nodos del clúster: si un nodo cae, el cliente reconecta al otro.
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    # Reparte las conexiones entre los nodos (por defecto siempre usaría el primero).
    address-shuffle-mode: random
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  kafka:
    # Cliente Kafka del consumidor de alertas (fan-out del tópico de eventos de pedidos).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Nombres de colas, exchanges, DLX y routing keys centralizados (cero hardcoding).
pedidos360:
  rabbitmq:
    exchange-topic: pedidos360.topic
    exchange-direct: pedidos360.direct
    exchange-dlx: pedidos360.dlx
    queue-notificaciones: pedidos360.notificaciones.queue
    queue-tickets: pedidos360.tickets.queue
    queue-documentos: pedidos360.documentos.queue
    queue-notificaciones-dlq: pedidos360.notificaciones.dlq
    queue-tickets-dlq: pedidos360.tickets.dlq
    queue-documentos-dlq: pedidos360.documentos.dlq
    routing-pedido-creado: pedido.creado
    routing-pedido-todos: "pedido.#"
    routing-pedido-entregado: pedido.estado.entregado
  kafka:
    # Mismo tópico que consume analytics-service, pero con OTRO consumer group:
    # ambos grupos reciben TODOS los eventos (fan-out / publish-subscribe).
    topic-pedidos-eventos: pedidos360.pedidos.eventos
    consumer-group-alertas: pedidos360-alertas-group
    # Monto a partir del cual un pedido se considera de alto valor (alerta).
    umbral-alto-valor: 100000

management:
  endpoints:
    web:
      exposure:
        include: health,info
