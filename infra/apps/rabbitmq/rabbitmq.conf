# Formación automática del clúster RabbitMQ (peer discovery clásico).
# Ambos nodos listan a sus pares: el primero en arrancar actúa como seed
# y el segundo se une sin intervención manual.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Evitar que un nodo sea purgado del clúster ante desconexiones transitorias.
cluster_formation.node_cleanup.only_log_warning = true
