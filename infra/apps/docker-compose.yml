services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    mem_limit: 200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-erlang-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-cluster.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 15

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-erlang-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-cluster.conf:ro
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl cluster_status | grep -q 'rabbit@rabbitmq1'"]
      interval: 10s
      timeout: 10s
      retries: 20

  pedidos-service:
    build:
      context: ../../pedidos360-pedidos-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JAVA_TOOL_OPTIONS: -Xmx220m
    ports:
      - "8081:8081"
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  productos-service:
    build:
      context: ../../pedidos360-productos-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JAVA_TOOL_OPTIONS: -Xmx220m
    ports:
      - "8082:8082"
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy

  consumer-service:
    build:
      context: ../../pedidos360-consumer-service
    environment:
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JAVA_TOOL_OPTIONS: -Xmx220m
    ports:
      - "8083:8083"
    mem_limit: 320m
    depends_on:
      rabbitmq1:
        condition: service_healthy

  admin-service:
    build:
      context: ../../pedidos360-admin-service
    environment:
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JAVA_TOOL_OPTIONS: -Xmx220m
    ports:
      - "8084:8084"
    mem_limit: 320m
    depends_on:
      rabbitmq1:
        condition: service_healthy

  bff:
    build:
      context: ../../pedidos360-bff
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DOWNSTREAM_PEDIDOS_URL: http://pedidos-service:8081
      DOWNSTREAM_PRODUCTOS_URL: http://productos-service:8082
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}
      JAVA_TOOL_OPTIONS: -Xmx220m
    ports:
      - "8080:8080"
    mem_limit: 320m
    depends_on:
      - pedidos-service
      - productos-service

volumes:
  postgres-data:
