server:
  port: 8086

spring:
  application:
    name: pedidos360-analytics-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    # Bootstrap servers y serializers del CLIENTE Kafka (productor y consumidor).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin encabezados de tipo: los mensajes son JSON puro interoperable entre servicios.
        spring.json.add.type.headers: false
        # Garantías de entrega: ACK de todas las réplicas ISR + idempotencia.
        acks: all
        enable.idempotence: true
    consumer:
      # Los consumidores se configuran de forma programática en KafkaConsumerConfig
      # (deserializador JSON tipado + ACK manual vía DefaultErrorHandler).
      auto-offset-reset: earliest

# Nombres de tópicos, grupos y DLT centralizados (cero hardcoding en código).
pedidos360:
  kafka:
    topic-pedidos-eventos: pedidos360.pedidos.eventos
    topic-analitica-metricas: pedidos360.analitica.metricas
    topic-pedidos-eventos-dlt: pedidos360.pedidos.eventos.dlt
    consumer-group-analytics: pedidos360-analytics-group
    consumer-group-reporting: pedidos360-reporting-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
