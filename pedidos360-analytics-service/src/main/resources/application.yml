server:
  port: 8086

spring:
  application:
    name: pedidos360-analytics-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    # Brokers del clúster. El resto del cliente se define en un solo lugar, en config/:
    # - KafkaProducerConfig: serializers JSON, acks=all, idempotencia, reintentos.
    # - KafkaConsumerConfig: ErrorHandlingDeserializer + JSON tipado, auto-offset-reset=earliest,
    #   commit manual por registro, concurrencia, reintentos con backoff y DLT.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Nombres de tópicos, grupos y DLT centralizados (cero hardcoding en código).
pedidos360:
  kafka:
    topic-pedidos-eventos: pedidos360.pedidos.eventos
    topic-analitica-metricas: pedidos360.analitica.metricas
    topic-pedidos-eventos-dlt: pedidos360.pedidos.eventos.dlt
    consumer-group-analytics: pedidos360-analytics-group
    consumer-group-reporting: pedidos360-reporting-group
    consumer-group-dlt-monitor: pedidos360-dlt-monitor-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
